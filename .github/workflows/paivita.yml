name: Päivitä autot

on:
  schedule:
    - cron: '0 7 * * 1,4'      # maanantaisin ja torstaisin klo 07:00 UTC (10:00 Suomen kesäaikaa, 09:00 talviaikaa)
  workflow_dispatch:           # "Run workflow" -nappi GitHubissa

permissions:
  contents: write

jobs:
  kylmala:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Hae Nettiautosta
        working-directory: kylmala
        run: node ../hae-nettiauto.js

      - name: Tallenna muutokset
        run: |
          git config user.name "autodata-bot"
          git config user.email "autodata-bot@users.noreply.github.com"
          git add kylmala/autot.json
          git diff --cached --quiet && echo "Ei muutoksia" || git commit -m "Kylmälä: autot päivitetty $(date -u +%Y-%m-%d)"
          git push
